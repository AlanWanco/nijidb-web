# bot 代理的固定入口：主上游是专用 mihomo，主上游不可用时自动切到备用上游。
#
# 备用上游默认指向路由器 OpenClash 的 HTTP 端口；也可以换成第二个 mihomo 容器。
# 注意：只做 TCP 透传，因此 bot 的代理行为完全由上游决定（节点切换、国内直连等）。
events {}

stream {
    upstream bot_proxy {
        server bot-mihomo:7890 max_fails=2 fail_timeout=15s;
        server 192.168.10.1:7890 backup max_fails=2 fail_timeout=15s;
    }

    server {
        listen 7890;
        proxy_pass bot_proxy;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
        proxy_socket_keepalive on;
    }
}
