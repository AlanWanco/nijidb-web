# 官网轮询 + 代理：2 个容器
#
#   mihomo   唯一的代理实例：per-node 入口端口（7901 起，供轮询挑节点）
#            + 共享端口 7890（规则：国内直连、其余走节点）供 bot 等客户端使用
#   worker   新闻轮询（常驻）+ 定时维护（节点健康检查、吞吐测速、订阅更新，跑完即退出）
#
# 使用前：
#   1. 生成初始节点配置：poller/mihomo/config.yaml（见 README，权限 600）
#   2. 生成密钥文件 poller/news-poller.env（600，参考 news-poller.env.example）
#   3. docker compose up -d --build
name: nijidb-poller

services:
  # 唯一的代理实例：既给轮询按节点端口挑出口，也给其它客户端一个带规则的共享端口
  mihomo:
    build:
      context: ./mihomo
      args:
        MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.31}
        MIHOMO_SHA256: ${MIHOMO_SHA256:-9e0f11afbf38426b8bd88fdc594678f8161c57eccb4e1b77acb12b493904f1d4}
    image: nijidb-mihomo:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    # 配置只读挂载；SAFE_PATHS 允许订阅更新通过控制台按路径重载
    command: ["-f", "/config/config.yaml"]
    env_file:
      # 只向 mihomo 注入控制台密钥，不把站点/R2 凭据传进代理容器
      - path: ./mihomo/controller.env
        required: true
    environment:
      SAFE_PATHS: /config
      # 容器默认 UTC，显式指定时区让日志与运行环境一致
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./mihomo:/config:ro
    networks:
      - proxy
    # 控制台只在本机可见；共享代理端口不发布到宿主，客户端通过 compose 网络访问 mihomo:7890
    ports:
      - "127.0.0.1:9099:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${MIHOMO_CONTROLLER_SECRET}\" -o /dev/null http://127.0.0.1:9090/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 一个容器跑全部业务：新闻轮询常驻，健康检查、吞吐测速与订阅更新定时执行（见 maintainer.json）
  worker:
    build:
      context: ..
      dockerfile: poller/news/Dockerfile
    image: nijidb-news-poller:local
    command: ["scripts/proxy_maintainer.py"]
    restart: unless-stopped
    depends_on:
      mihomo:
        condition: service_started
    env_file:
      - path: ./news-poller.env
        required: false
      - path: ./mihomo/controller.env
        required: true
    # 宿主局域网 DNS 会把外域名映射到 mihomo fake-IP（198.18.0.0/15），
    # 这会让 worker 的公网测速地址校验误判为内网地址；worker 不承担代理解析，使用可信公网 DNS。
    dns:
      - 1.1.1.1
      - 223.5.5.5
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NIJIDB_LOG_TZ_OFFSET_HOURS: ${NIJIDB_LOG_TZ_OFFSET_HOURS:-8}
      MAINTAINER_CONFIG: /app/maintainer.json
      NEWS_POLL_PROXY: http://mihomo:7890
      NEWS_POLL_NODES_FILE: /state/nodes.json
      NEWS_POLL_HINTS_FILE: /state/poller-hints.json
      NEWS_POLL_PROXY_HOST: mihomo
      NEWS_POLL_STATE_FILE: /state/news-poller.json
    volumes:
      # 订阅更新会重新渲染配置，因此要能写
      - ./mihomo:/config
      - poller-state:/state
      - ./maintainer.json:/app/maintainer.json:ro
    networks:
      - proxy

  # 可选：历史新闻图片批量归档（补档）。默认不启动：
  #   docker compose --profile worker up -d
  image-worker:
    profiles: ["worker"]
    image: nijidb-news-poller:local
    command: ["scripts/remote_news_image_worker.py"]
    restart: unless-stopped
    depends_on:
      mihomo:
        condition: service_started
    env_file:
      - ./news-poller.env
    environment:
      NEWS_WORKER_PROXY: http://mihomo:7890
      NEWS_WORKER_STATE_FILE: /state/image-worker.json
    volumes:
      - poller-state:/state
    networks:
      - proxy

volumes:
  poller-state:

networks:
  proxy:
