# 新闻轮询与图片补档；代理由独立 Mihomo Compose 提供
name: nijidb-poller

services:
  worker:
    build:
      context: ..
      dockerfile: poller/news/Dockerfile
    image: nijidb-news-poller:local
    command: ["scripts/local_official_news_poller.py"]
    restart: unless-stopped
    env_file:
      - path: ./news-poller.env
        required: false
    # Use trusted public DNS for direct Nijidb API and R2 traffic; official-site DNS is proxy-side.
    dns:
      - 1.1.1.1
      - 223.5.5.5
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NIJIDB_LOG_TZ_OFFSET_HOURS: ${NIJIDB_LOG_TZ_OFFSET_HOURS:-8}
      NEWS_POLL_PROXY: ${POLL_PROXY_URL:-http://192.168.10.75:7890}
      NEWS_POLL_STATE_FILE: /state/news-poller.json
      # Do not pass legacy proxy subscription credentials through the shared env file.
      MIHOMO_SUB_URL: ""
    volumes:
      - poller-state:/state

  # 可选：历史新闻图片批量归档（补档），默认不启动：
  #   docker compose --profile worker up -d
  image-worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: poller/news/Dockerfile
    image: nijidb-news-poller:local
    command: ["scripts/remote_news_image_worker.py"]
    restart: unless-stopped
    env_file:
      - path: ./news-poller.env
        required: false
    dns:
      - 1.1.1.1
      - 223.5.5.5
    environment:
      NEWS_WORKER_PROXY: ${POLL_PROXY_URL:-http://192.168.10.75:7890}
      NEWS_WORKER_STATE_FILE: /state/image-worker.json
      MIHOMO_SUB_URL: ""
    volumes:
      - poller-state:/state

volumes:
  poller-state:
