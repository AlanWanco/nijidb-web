# 官网轮询 + bot 专用代理（单项目、5 个容器）
#
#   mihomo        轮询出口（每节点一个入口端口）
#   maintainer    定时维护：节点健康检查 + 两个栈的订阅更新（三个独立进程）
#   news-poller   官网新闻内容轮询
#   bot-mihomo    bot 专用出口（fallback 组 + 国内直连）
#   bot-gateway   bot 的固定入口（主上游失败自动切备用）
#
# 使用前：
#   1. 生成初始节点配置：poller/mihomo/config.yaml、poller/bot-proxy/config.yaml（见 README，权限 600）
#   2. 生成密钥文件 poller/news-poller.env（600，参考 news-poller.env.example）
#   3. 需要兜底上游时，在 poller/.env（600，不提交）里设置 BOT_BACKUP_PROXY
#   4. docker compose up -d --build
name: nijidb-poller

services:
  # ---------- 轮询出口 ----------

  mihomo:
    build:
      context: ./mihomo
      args:
        MIHOMO_VERSION: ${MIHOMO_VERSION:-v1.19.31}
        MIHOMO_SHA256: ${MIHOMO_SHA256:-9e0f11afbf38426b8bd88fdc594678f8161c57eccb4e1b77acb12b493904f1d4}
    image: nijidb-mihomo:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["-f", "/config/config.yaml"]
    environment:
      SAFE_PATHS: /config
    volumes:
      - ./mihomo:/config:ro
    networks:
      - proxy
    ports:
      - "127.0.0.1:9099:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9090/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------- 定时维护（健康检查 + 订阅更新） ----------

  maintainer:
    image: nijidb-news-poller:local
    command: ["scripts/proxy_maintainer.py"]
    restart: unless-stopped
    depends_on:
      mihomo:
        condition: service_started
      bot-mihomo:
        condition: service_started
    env_file:
      - path: ./news-poller.env
        required: false
    environment:
      MAINTAINER_CONFIG: /app/maintainer.json
    volumes:
      # 两份配置都要能写：订阅更新会重新渲染并让对应 mihomo 重载
      - ./mihomo:/config/news
      - ./bot-proxy:/config/bot
      - poller-state:/state
      - ./maintainer.json:/app/maintainer.json:ro
    networks:
      - proxy

  # ---------- 内容轮询 ----------

  news-poller:
    build:
      context: ..
      dockerfile: poller/news/Dockerfile
    image: nijidb-news-poller:local
    restart: unless-stopped
    depends_on:
      mihomo:
        condition: service_started
    env_file:
      - ./news-poller.env
    environment:
      NEWS_POLL_PROXY: http://mihomo:7890
      NEWS_POLL_NODES_FILE: /state/nodes.json
      NEWS_POLL_HINTS_FILE: /state/poller-hints.json
      NEWS_POLL_PROXY_HOST: mihomo
      NEWS_POLL_STATE_FILE: /state/news-poller.json
    volumes:
      - poller-state:/state
    networks:
      - proxy

  # ---------- bot 专用出口 ----------

  bot-mihomo:
    image: nijidb-mihomo:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["-f", "/config/config.yaml"]
    environment:
      SAFE_PATHS: /config
    volumes:
      - ./bot-proxy:/config:ro
    networks:
      - proxy
    ports:
      - "127.0.0.1:9199:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9090/version"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # bot 的固定入口：主上游为 bot-mihomo，失败自动切备用上游（BOT_BACKUP_PROXY）
  bot-gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - bot-mihomo
    environment:
      BACKUP_PROXY: "${BOT_BACKUP_PROXY:-192.168.1.1:7890}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        envsubst '$${BACKUP_PROXY}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        && exec nginx -g 'daemon off;'
    volumes:
      - ./bot-proxy/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    networks:
      - proxy
    # 需要给宿主或其它网络的容器使用时再打开（注意这是无认证的代理端口）
    # ports:
    #   - "192.168.1.10:7899:7890"

  # ---------- 可选：历史图片补档 ----------
  # profile 启用：docker compose --profile worker up -d

  image-worker:
    profiles: ["worker"]
    image: nijidb-news-poller:local
    command: ["scripts/remote_news_image_worker.py"]
    restart: unless-stopped
    depends_on:
      mihomo:
        condition: service_started
    env_file:
      - ./news-poller.env
    environment:
      NEWS_WORKER_PROXY: http://mihomo:7890
      NEWS_WORKER_STATE_FILE: /state/image-worker.json
    volumes:
      - poller-state:/state
    networks:
      - proxy

volumes:
  poller-state:

networks:
  proxy:
